# Build an Arch package without publishing it. release-native.yml owns publication.
name: Arch package
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to package (artifacts only)
        type: string
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag }}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm cargo git fontconfig freetype2 libxcb libxkbcommon libxkbcommon-x11 wayland
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build and inspect the package
        run: |
          useradd -m builder
          chown -R builder .
          # The tag predates the checksum-pinning commit on main. The downloaded
          # source is the exact tag selected by the release orchestrator.
          su builder -c 'makepkg -f --noconfirm --nodeps --skipinteg'
          mkdir dist
          cp bref-[0-9]*-x86_64.pkg.tar.zst dist/
          cp bref-[0-9]*-x86_64.pkg.tar.zst dist/bref-x86_64.pkg.tar.zst
          pacman -Qip dist/bref-x86_64.pkg.tar.zst
          bsdtar -tf dist/bref-x86_64.pkg.tar.zst > /tmp/package-contents
          grep -Fx 'usr/bin/bref' /tmp/package-contents
      - uses: actions/upload-artifact@v4
        with:
          name: native-arch
          path: dist/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
