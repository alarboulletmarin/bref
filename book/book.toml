[book]
title = "Bref user guide"
description = "How to use Bref, a fast, minimal note-taking app for plain Markdown files."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/alarboulletmarin/bref"
edit-url-template = "https://github.com/alarboulletmarin/bref/edit/main/book/{path}"
site-url = "/bref/guide/"
no-section-label = true

[output.html.fold]
enable = true
level = 1
