[package]
name = "encre"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "Fast, minimal Markdown note-taking app"
license = "MIT"
repository = "https://github.com/alarboulletmarin/encre"

[dependencies]
gpui = "0.2.2"
latex-rust = "2.1.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
unicode-segmentation = "1.13.3"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
