[package]
name = "bref"
version = "0.4.7"
edition = "2024"
rust-version = "1.88"
description = "Fast, minimal Markdown note-taking app"
license = "MIT"
repository = "https://github.com/alarboulletmarin/bref"

[dependencies]
# Déjà tirée par gpui, à la même version : images PNG du serveur MCP.
base64 = "0.22.1"
# Déjà tirée par gpui, à la même version : l'archive de la sauvegarde.
flate2 = "1.1.4"
gpui = "0.2.2"
latex-rust = "2.1.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# Le système signale les changements du coffre (inotify, FSEvents…). La 7 et non la 8 : celle-ci
# exige bitflags 2.11 (via kqueue-sys) et ferait bouger le Cargo.lock de GPUI.
notify = "7"
# Comes with svg2pdf, at the same version: the pages and the links of an exported PDF.
pdf-writer = "0.12.1"
# Déjà tirée par gpui, à la même version : expressions régulières de la recherche.
regex = "1.12.2"
# Déjà tirées par gpui, aux mêmes versions : import et export des schémas.
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
roxmltree = "0.20.0"
serde_json = "1.0.145"
# A note exported as PDF: its pages drawn as SVG, the text kept as text. Reuses the usvg of gpui.
svg2pdf = { version = "0.13.0", default-features = false, features = ["text", "image"] }
# Comes with usvg and svg2pdf, at the same version: the widths of the letters, to lay out a printed page.
ttf-parser = "0.25.1"
# Déjà tirée par gpui, à la même version : somme de contrôle de la mise à jour.
sha2 = "0.10.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Déjà tirée par gpui, à la même version : la date locale, que la bibliothèque standard ignore.
[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# Déjà tirée par gpui, à la même version : icône de bref.exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.release]
# The whole program optimised as one: 6 % smaller than "thin", and no slower.
lto = "fat"
codegen-units = 1
strip = true

# Code that never runs while typing is built for size: diagrams, formulas and the PDF export (drawn off
# the UI thread or on demand), the desktop portal and keyring (D-Bus), shaders translated once at
# startup, picture formats rarely met. The editor, GPUI, text shaping and search keep full speed.
# Measured with the benchmarks of `src/shell/tests/benches.rs`: the binary loses another 6 %, and no
# gesture is slower. Everything at "s" would lose 28 %, and cost 15 % of time on every keystroke.
[profile.release.package]
mermaid-rs-renderer.opt-level = "s"
latex-rust.opt-level = "s"
svg2pdf.opt-level = "s"
pdf-writer.opt-level = "s"
subsetter.opt-level = "s"
write-fonts.opt-level = "s"
naga.opt-level = "s"
codespan-reporting.opt-level = "s"
zbus.opt-level = "s"
zvariant.opt-level = "s"
ashpd.opt-level = "s"
oo7.opt-level = "s"
num-bigint-dig.opt-level = "s"
fontconfig-parser.opt-level = "s"
xim-parser.opt-level = "s"
regex-syntax.opt-level = "s"
image-webp.opt-level = "s"
exr.opt-level = "s"
tiff.opt-level = "s"
gif.opt-level = "s"
